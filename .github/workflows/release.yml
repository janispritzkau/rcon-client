name: Release

# A v* tag stages the version on npm through trusted publishing. It goes live
# only after a maintainer runs `npm stage approve rcon-client@<version>` (with
# 2FA). The trusted publisher on npm is configured to allow staging only.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      # Pinned to commits: this job can publish, so a moved tag must not change it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install --global npm@11.21.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: Stage on npm
        run: |
          tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm stage publish --provenance --access public --tag "$tag"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::GitHub Release $tag already exists, nothing to do."
            exit 0
          fi
          flags=(--verify-tag --generate-notes)
          if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
          notes="Staged on npm. It becomes installable once a maintainer approves it with \`npm stage approve rcon-client@${tag#v}\`."
          delays=(10 30)
          for attempt in 1 2 3; do
            if gh release create "$tag" "${flags[@]}" --notes "$notes"; then
              exit 0
            fi
            if (( attempt == 3 )); then break; fi
            delay=${delays[attempt - 1]}
            echo "::warning::gh release create failed (attempt $attempt of 3), retrying in ${delay}s."
            sleep "$delay"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::GitHub Release $tag exists after the failed attempt, nothing to do."
              exit 0
            fi
          done
          echo "::error::Could not create the GitHub Release for $tag after 3 attempts. The npm version is already staged, so do not re-run this job; create the release by hand with: gh release create $tag ${flags[*]}"
          exit 1
